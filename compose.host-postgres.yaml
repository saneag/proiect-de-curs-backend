# Select with COMPOSE_FILE=compose.host-postgres.yaml in the server .env.
# Existing Docker database volumes/containers are retained for rollback.
services:
    migrate:
        build:
            context: .
            target: migration
        environment:
            DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Ubuntu PostgreSQL database}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        restart: 'no'

    api:
        networks:
            default:
                aliases:
                    - friendo-api
        build:
            context: .
            target: runtime
        restart: unless-stopped
        ports:
            - '127.0.0.1:${BACKEND_PORT:-5001}:5000'
        environment:
            PORT: 5000
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5000}
            JWTSECRET: ${JWTSECRET:?Set JWTSECRET in .env}
            JWTREFRESHSECRET: ${JWTREFRESHSECRET:?Set JWTREFRESHSECRET in .env}
            DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            migrate:
                condition: service_completed_successfully
        volumes:
            - uploads_data:/app/build/uploads

    frontend:
        build:
            context: ../proiect-de-curs-frontend
            args:
                VITE_API_URL: /api/hf
        restart: unless-stopped
        ports:
            - '127.0.0.1:${FRONTEND_PORT:-5000}:80'
        depends_on:
            - api

networks:
    default:
        external: true
        name: home-apps

volumes:
    uploads_data:
