services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friendo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-friendo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env using postgres as the database hostname}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    networks:
      default:
        aliases:
          - friendo-api
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    environment:
      PORT: 5000
      UPLOADS_DIR: /uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8082}
      JWTSECRET: ${JWTSECRET:?Set JWTSECRET in .env}
      JWTREFRESHSECRET: ${JWTREFRESHSECRET:?Set JWTREFRESHSECRET in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${UPLOADS_HOST_DIR:-/srv/hdd/project-images/friendo}:/uploads

  frontend:
    build:
      context: ../proiect-de-curs-frontend
      args:
        VITE_API_URL: /api/hf
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
